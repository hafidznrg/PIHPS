# Transformasi PIHPS: raw (JSON.gz + manifest) -> staging -> marts, semuanya Parquet.
# Jalankan lewat `uv run python -m pihps.transform build` (mengisi var raw_root/out_root).
name: pihps
version: "0.2.0"
config-version: 2
profile: pihps

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "logs"]

vars:
  # Direktori yang berisi `raw/pihps/...` dengan layout persis seperti di R2.
  raw_root: "../data"
  # Direktori keluaran Parquet; isinya dipublish ke R2 dengan key yang sama.
  out_root: "../data/out"
  # Awal data PIHPS (probe F0); versi pertama dim_wilayah berlaku sejak tanggal ini.
  data_start: "2017-06-01"
  # Rentang harga wajar per kg (Rp) untuk tes kualitas data berseverity warn.
  harga_wajar_min: 1000
  harga_wajar_max: 500000
  # Deteksi outlier (fct_harga_harian.is_outlier): harga di bawah batas absolut, atau
  # menyimpang > faktor x dari median 11 hari publikasi di sekitarnya pada seri yang sama.
  outlier_harga_min: 500
  # Batas atas absolut: menangkap salah input yang berlangsung lama (mis. Rp12 juta/kg selama
  # sebulan) sehingga median jendela ikut tercemar. Tidak ada komoditas PIHPS wajar > Rp1 juta/kg.
  outlier_harga_max: 1000000
  outlier_faktor: 3
  outlier_jendela: 5
  outlier_min_tetangga: 5
  # Serving: seri harian N hari terakhir; seri dianggap aktif bila data terakhirnya tidak
  # lebih tua dari N hari dari tanggal acuan; perubahan < ambang % dianggap "tetap".
  serving_hari_seri_harian: 90
  serving_hari_aktif: 14
  serving_ambang_tetap_pct: 0.5

models:
  pihps:
    staging:
      +materialized: view
    marts:
      +materialized: external
      +format: parquet
    # Serving: tabel di DuckDB; pihps.serving menulisnya sebagai JSON berkontrak ke serving/.
    serving:
      +materialized: table

seeds:
  pihps:
    +quote_columns: false

tests:
  pihps:
    +store_failures: false
