[project]
name = "pihps"
version = "0.1.0"
description = "Pipeline data harga pangan strategis Indonesia dari PIHPS Nasional (Bank Indonesia)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
transform = [
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "jsonschema>=4.23",
]

[tool.uv]
default-groups = ["dev", "transform"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pihps"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
