name: probe

# Uji asumsi: akses PIHPS dari runner GitHub, bentuk respons, kedalaman historis,
# tulis/baca R2, dan pengiriman Telegram. Dijalankan manual.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --no-default-groups

      - name: Network sanity check
        run: |
          curl -sS -m 30 -o /dev/null -w "bi.go.id GetRefProvince -> HTTP %{http_code} in %{time_total}s\n" \
            -H "X-Requested-With: XMLHttpRequest" \
            "https://www.bi.go.id/hargapangan/WebSite/TabelHarga/GetRefProvince" || true

      - name: Run probe
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python -m pihps.probe

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: probe_result.json
          if-no-files-found: ignore

      - name: Alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=❌ Workflow ${GITHUB_WORKFLOW} gagal: ${URL}" > /dev/null
